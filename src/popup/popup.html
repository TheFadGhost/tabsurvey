<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Tabsurvey</title>
<script>
(function(){var t=null;try{t=localStorage.getItem("tabsurvey.themeMirror")}catch(e){}if(t!=="light"&&t!=="dark"&&t!=="high-contrast"){try{t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}catch(e){t="light"}}try{document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="../shared/components.css">
<link rel="stylesheet" href="popup.css">
</head>
<body class="popup-body">
<h1 class="visually-hidden">Tabsurvey popup</h1>
<header class="popup-header">
  <span class="brand-name">Tabsurvey</span>
  <span id="count" class="badge">0</span>
  <span class="footer-spacer"></span>
  <button id="open-settings" class="btn btn--ghost btn--small icon-btn" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.8v3M12 18.2v3M21.2 12h-3M5.8 12h-3M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1M18.5 18.5l-2.1-2.1M7.6 7.6L5.5 5.5"></path></svg>
  </button>
</header>
<div class="search-row">
  <input id="search" class="input" type="search" placeholder="Search tabs" aria-label="Search tabs" autocomplete="off" spellcheck="false">
</div>
<nav id="filters" class="chips filters" aria-label="Filters"></nav>
<main id="list" class="list popup-list" role="list" aria-label="Open tabs"></main>
<p id="empty-note" class="empty-note" hidden></p>
<footer class="popup-footer">
  <span id="footstats" class="muted"></span>
  <span class="footer-spacer"></span>
  <button id="enable-reading" class="btn btn--primary btn--small" type="button" hidden>Enable page reading</button>
  <button id="open-dash" class="btn btn--ghost btn--small" type="button">Open dashboard</button>
</footer>
<section id="settings-panel" class="settings-panel" hidden aria-label="Popup settings">
  <div class="field">
    <label for="theme-select">Theme</label>
    <select id="theme-select" class="input">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="high-contrast">High contrast</option>
    </select>
  </div>
  <fieldset class="field fieldset">
    <legend>Summary length</legend>
    <div class="radio-row">
      <label><input type="radio" name="summary-length" value="short">Short</label>
      <label><input type="radio" name="summary-length" value="medium" checked>Medium</label>
      <label><input type="radio" name="summary-length" value="long">Long</label>
    </div>
  </fieldset>
  <div class="field grow">
    <label for="excluded-domains">Excluded domains, one per line</label>
    <textarea id="excluded-domains" class="input" rows="5" spellcheck="false" placeholder="example.com"></textarea>
    <button id="save-excluded" class="btn btn--primary btn--small" type="button">Save domains</button>
  </div>
</section>
<script type="module" src="./popup.js"></script>
</body>
</html>
